name: Rust check

concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - master

jobs:
  platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-15", "windows-2022"]
    steps:
      - uses: actions/checkout@v5
      - name: Install rustup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check cargo fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy

      - name: Doc
        run: cargo doc --no-deps

      - name: Tests
        if: runner.os == 'linux'
        env:
          DOCKERTEST_DYNAMIC: INTERNAL
          DOCKERTEST_BUILD_TEST_IMAGES: 1
        run: cargo test

      - name: Build tests
        if: runner.os != 'linux'
        run: cargo test build
