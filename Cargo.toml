[package]
name = "dockertest"
version = "0.5.0"
authors = [
    "Vegard Sandengen <vegard@orcalabs.no>",
    "Jon Foss Mikalsen <jon@orcalabs.no>",
]
edition = "2018"
license = "MIT"
description = "A library to control docker containers when running your integration tests."
homepage = "https://www.orcalabs.no"
repository = "https://github.com/orcalabs/dockertest-rs"
keywords = ["docker", "integration", "test", "container"]
categories = ["development-tools", "development-tools::testing"]
readme = "README.md"
documentation = "https://docs.rs/dockertest"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
base64 = "0.22.1"
bollard = "0.19.4"
dyn-clone = "1.0.20"
futures = "0.3.31"
secrecy = "0.10.3"
serde = "1.0.228"
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
rand = "0.9.2"
bytes = "1.11.0"
strum = { version = "0.27.2", features = ["derive"] }

[dev-dependencies]
access-queue = "1.1.0"
once_cell = "1.21.3"
test-log = { version = "0.2.18", default-features = false, features = [
    "trace",
] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "env-filter",
    "fmt",
] }

[build-dependencies]
anyhow = "1.0.100"

[features]
tls = ["bollard/ssl"]
